<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valéria Almeida Estilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0908;
    --surface:#15130f;
    --line: rgba(201,160,90,0.28);
    --text:#f7f2e6;
    --text-dim:#9c9184;
    --accent:#c9a05a;
    --accent-2:#ecd6a0;
    --accent-deep:#8a6a34;
    --whatsapp:#25d366;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Jost', system-ui, sans-serif;
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    max-width:480px;
    min-height:100%;
    background:var(--bg);
    position:relative;
  }

  /* ---------- HERO ---------- */
  .hero-card{
    margin: 22px 22px 0;
    border-radius:20px;
    overflow:hidden;
    aspect-ratio: 4 / 5;
    background:#000;
    border:1px solid var(--line);
    box-shadow: 0 24px 46px -26px rgba(0,0,0,0.75);
  }
  .hero-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: 50% 22%;
    display:block;
  }

  /* ---------- BRAND ---------- */
  .brand-block{
    text-align:center;
    padding: 26px 24px 4px;
  }
  .brand{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(32px, 9vw, 42px);
    line-height:1.05;
    color:var(--text);
    margin:0;
    text-wrap:balance;
  }
  .brand-rule{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:10px 0;
  }
  .brand-rule::before,
  .brand-rule::after{
    content:"";
    width:30px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .brand-rule::after{ background: linear-gradient(90deg, var(--accent), transparent); }
  .brand-rule span{
    font-family:'Jost', sans-serif;
    font-size:12px;
    font-weight:500;
    letter-spacing:.38em;
    color:var(--accent-2);
    text-transform:uppercase;
  }
  .categories{
    font-size:10.5px;
    font-weight:500;
    letter-spacing:.16em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin:0;
  }

  /* ---------- LINKS ---------- */
  .content{
    padding: 22px 22px calc(28px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:13px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    text-decoration:none;
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:14.5px;
    letter-spacing:.01em;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .link-btn:active{ transform: scale(0.98); }
  .link-btn:hover{ border-color:var(--accent); }
  .link-btn:focus-visible{ outline:2px solid var(--accent-2); outline-offset:3px; }

  .link-btn .icon{
    flex:none;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent-2);
  }
  .link-btn .icon svg{ width:20px; height:20px; }

  .link-btn .label{ flex:1; font-weight:600; }
  .link-btn .arrow{ flex:none; color:var(--accent); font-size:15px; line-height:1; opacity:.85; }

  .link-btn.primary{
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    border-color: transparent;
    color:#241b0c;
    box-shadow: 0 16px 30px -14px rgba(201,160,90,0.55);
  }
  .link-btn.primary .icon{ color:#241b0c; }
  .link-btn.primary .arrow{ color:#241b0c; }
  .link-btn.primary:hover{ filter:brightness(1.04); }

  .sign-off{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding-top:16px;
  }
  .monogram{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    color:var(--accent-2);
  }
  .sign-off span{
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  @media (prefers-reduced-motion: no-preference){
    .hero-card, .brand-block, .content > *{
      animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
    }
    .brand-block{ animation-delay:.05s; }
    .content > *:nth-child(1){ animation-delay:.1s; }
    .content > *:nth-child(2){ animation-delay:.15s; }
    .content > *:nth-child(3){ animation-delay:.2s; }
    .content > *:nth-child(4){ animation-delay:.25s; }
    .content > *:nth-child(5){ animation-delay:.3s; }
    @keyframes rise{
      from{ opacity:0; transform:translateY(10px); }
      to{ opacity:1; transform:translateY(0); }
    }
  }
</style>
</head>
<body>

<div class="page">

    </a>

    <a class="link-btn" href="https://maps.app.goo.gl/n8oYVNds5knzCqKd6?g_st=ic" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg></span>

    <div class="sign-off">

    </div>
  </div>
</div>

</body>
</html>
